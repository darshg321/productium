# XcodeGen spec → Productium.xcodeproj  (generated on the macOS CI runner; no Mac needed locally)
# Free Apple ID build: the app (HealthKit its only capability) plus one widget extension (Live Activity, controls; no
# capabilities, so a second free App ID).
# APP_ID / APP_NAME / APP_SCHEME / APP_ICON come from CI: release builds are com.<you>.productium "Productium";
# dev builds are com.<you>.productium.dev "Productium Dev" with their own icon and URL scheme, so both install side
# by side with separate data. Set BUNDLE_PREFIX (e.g. com.yourname) as an env var.
name: Productium
options:
  bundleIdPrefix: ${BUNDLE_PREFIX}
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO

packages:
  ProductiumCore:
    path: Packages/ProductiumCore

targets:
  Productium:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    dependencies:
      - package: ProductiumCore
      - target: ProductiumWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${APP_ID}
        ASSETCATALOG_COMPILER_APPICON_NAME: ${APP_ICON}
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) ENABLE_ALARMKIT
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    entitlements:
      path: App/Productium.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.healthkit.background-delivery: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: ${APP_NAME}
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ProductiumURLScheme: ${APP_SCHEME}
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSSupportsLiveActivities: true
        UIBackgroundModes: [fetch, processing, location]
        BGTaskSchedulerPermittedIdentifiers: [app.productium.refresh]
        NSHealthShareUsageDescription: Productium reads sleep, wake time, steps and daylight to plan around how rested you are and when you wake up.
        NSHealthUpdateUsageDescription: Productium saves the moods you log as State of Mind.
        NSCalendarsFullAccessUsageDescription: Productium reads your calendar so it never plans over events, and can add your study plan to a Productium calendar.
        NSLocationWhenInUseUsageDescription: Productium notes where each part of your day happened, so it can fill in your day and show where your time goes.
        NSLocationAlwaysAndWhenInUseUsageDescription: Productium keeps a location history on this phone (in your backups, never sent anywhere) so each entry knows where it happened, places name themselves, and it can notice when your day differs from the plan. You can forget it in Settings → Privacy.
        NSMotionUsageDescription: Productium notices walks and rides to log your commute and fill in your day.
        NSAlarmKitUsageDescription: Productium sets your wake-up alarm based on when your first class starts and your usual commute.
        NSUserActivityTypes: [TellProductiumIntent, LogMoodIntent, StartFocusIntent, StartActivityIntent, StopActivityIntent, ToggleActivityIntent]
        NSRemindersFullAccessUsageDescription: Productium keeps your open tasks in a "Productium" list, so Reminders, its widgets and Siri show them, and ticking one off there finishes it here.
        NSPhotoLibraryUsageDescription: Productium reads new Screen Time screenshots on the phone (nothing else is looked at) so you don't have to send them yourself.
        CFBundleURLTypes:
          - CFBundleURLName: ${APP_SCHEME}
            CFBundleURLSchemes:
              - ${APP_SCHEME}
        ITSAppUsesNonExemptEncryption: false

  ProductiumWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widgets
      - Shared/RunningActivity.swift
      - Shared/AppInfo.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${APP_ID}.widgets
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) WIDGET_EXTENSION
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: ${APP_NAME}
        ProductiumURLScheme: ${APP_SCHEME}
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

schemes:
  Productium:
    build:
      targets:
        Productium: all
    run:
      config: Debug
    archive:
      config: Release
