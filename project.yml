# XcodeGen spec → Productium.xcodeproj  (generated on the macOS CI runner; no Mac needed locally)
# Set BUNDLE_PREFIX (e.g. com.yourname) and DEVELOPMENT_TEAM (10-char Apple team id) as env vars.
name: Productium
options:
  bundleIdPrefix: ${BUNDLE_PREFIX}
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    APP_GROUP: group.${BUNDLE_PREFIX}.productium
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO

packages:
  ProductiumCore:
    path: Packages/ProductiumCore

targets:
  Productium:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    dependencies:
      - package: ProductiumCore
      - target: ProductiumMonitor
      - target: ProductiumReport
      - target: ProductiumShield
      - target: ProductiumShieldAction
      - target: ProductiumWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_PREFIX}.productium
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) ENABLE_ALARMKIT
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    entitlements:
      path: App/Productium.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.healthkit.background-delivery: true
        com.apple.security.application-groups: [$(APP_GROUP)]
        com.apple.developer.usernotifications.time-sensitive: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Productium
        AppGroup: $(APP_GROUP)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [fetch, processing]
        BGTaskSchedulerPermittedIdentifiers: [app.productium.refresh]
        NSSupportsLiveActivities: true
        NSHealthShareUsageDescription: Productium reads sleep, wake time, steps and daylight to plan around how rested you are and when you wake up.
        NSHealthUpdateUsageDescription: Productium logs breathing breaks as Mindful Minutes.
        NSCalendarsFullAccessUsageDescription: Productium reads your calendar so it never plans over events, and can add your study plan to a Productium calendar.
        NSLocationWhenInUseUsageDescription: Productium saves your home and school so it can check you in automatically.
        NSLocationAlwaysAndWhenInUseUsageDescription: Productium notices when you leave home or arrive at school to learn your commute. It keeps no location history.
        NSAlarmKitUsageDescription: Productium sets your wake-up alarm based on when your first class starts and your usual commute.
        NSUserActivityTypes: [TellProductiumIntent, CheckInIntent, LogMoodIntent, StartFocusIntent]
        CFBundleURLTypes:
          - CFBundleURLName: productium
            CFBundleURLSchemes: [productium]
        ITSAppUsesNonExemptEncryption: false

  ProductiumMonitor:
    type: app-extension
    platform: iOS
    sources: [Extensions/Monitor, Shared/SharedConfig.swift, Shared/ScreenShield.swift]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_PREFIX}.productium.monitor
    entitlements:
      path: Extensions/Monitor/Monitor.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [$(APP_GROUP)]
    info:
      path: Extensions/Monitor/Info.plist
      properties:
        CFBundleDisplayName: Productium Monitor
        AppGroup: $(APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ActivityMonitor

  ProductiumReport:
    type: extensionkit-extension
    platform: iOS
    sources: [Extensions/Report]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_PREFIX}.productium.report
    entitlements:
      path: Extensions/Report/Report.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [$(APP_GROUP)]
    info:
      path: Extensions/Report/Info.plist
      properties:
        CFBundleDisplayName: Productium Report
        EXAppExtensionAttributes:
          EXExtensionPointIdentifier: com.apple.deviceactivityui.report-extension

  ProductiumShield:
    type: app-extension
    platform: iOS
    sources: [Extensions/Shield, Shared/SharedConfig.swift, Shared/ScreenShield.swift]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_PREFIX}.productium.shield
    entitlements:
      path: Extensions/Shield/Shield.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [$(APP_GROUP)]
    info:
      path: Extensions/Shield/Info.plist
      properties:
        CFBundleDisplayName: Productium Shield
        AppGroup: $(APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettingsUI.shield-configuration-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldConfigurationExtension

  ProductiumShieldAction:
    type: app-extension
    platform: iOS
    sources: [Extensions/ShieldAction, Shared/SharedConfig.swift, Shared/ScreenShield.swift]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_PREFIX}.productium.shieldaction
    entitlements:
      path: Extensions/ShieldAction/ShieldAction.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [$(APP_GROUP)]
    info:
      path: Extensions/ShieldAction/Info.plist
      properties:
        CFBundleDisplayName: Productium Shield Action
        AppGroup: $(APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettings.shield-action-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldActionExtension

  ProductiumWidgets:
    type: app-extension
    platform: iOS
    sources: [Extensions/Widgets, Shared/SharedConfig.swift, Shared/BlockActivity.swift]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_PREFIX}.productium.widgets
    entitlements:
      path: Extensions/Widgets/Widgets.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP)]
    info:
      path: Extensions/Widgets/Info.plist
      properties:
        CFBundleDisplayName: Productium Widgets
        AppGroup: $(APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

schemes:
  Productium:
    build:
      targets:
        Productium: all
    run:
      config: Debug
    archive:
      config: Release
