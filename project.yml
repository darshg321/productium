# XcodeGen spec → Productium.xcodeproj  (generated on the macOS CI runner; no Mac needed locally)
# Free Apple ID build: one app, HealthKit the only capability. Set BUNDLE_PREFIX (e.g. com.yourname) as an env var.
name: Productium
options:
  bundleIdPrefix: ${BUNDLE_PREFIX}
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO

packages:
  ProductiumCore:
    path: Packages/ProductiumCore

targets:
  Productium:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    dependencies:
      - package: ProductiumCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_PREFIX}.productium
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) ENABLE_ALARMKIT
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    entitlements:
      path: App/Productium.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.healthkit.background-delivery: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Productium
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        UIBackgroundModes: [fetch, processing]
        BGTaskSchedulerPermittedIdentifiers: [app.productium.refresh]
        NSHealthShareUsageDescription: Productium reads sleep, wake time, steps and daylight to plan around how rested you are and when you wake up.
        NSHealthUpdateUsageDescription: Productium logs breathing breaks as Mindful Minutes.
        NSCalendarsFullAccessUsageDescription: Productium reads your calendar so it never plans over events, and can add your study plan to a Productium calendar.
        NSLocationWhenInUseUsageDescription: Productium saves your home and school so it can check you in automatically.
        NSLocationAlwaysAndWhenInUseUsageDescription: Productium notices when you leave home or arrive at school to learn your commute. It keeps no location history.
        NSMotionUsageDescription: Productium notices walks and rides to learn your commute and fill in your day. Only how long you moved is kept, never where.
        NSAlarmKitUsageDescription: Productium sets your wake-up alarm based on when your first class starts and your usual commute.
        NSUserActivityTypes: [TellProductiumIntent, CheckInIntent, LogMoodIntent, StartFocusIntent]
        CFBundleURLTypes:
          - CFBundleURLName: productium
            CFBundleURLSchemes: [productium]
        ITSAppUsesNonExemptEncryption: false

schemes:
  Productium:
    build:
      targets:
        Productium: all
    run:
      config: Debug
    archive:
      config: Release
