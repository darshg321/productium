# Builds Productium without a Mac.
#  • core-tests: the planning engine, on Linux (every push)
#  • ios-compile: compile-check the app for the simulator, unsigned (every push)
#  • ios-free-ipa: on a push to main or dev that changes code (see `paths` below), builds the free-account .ipa.
#      main: releases v<VERSION>.<n> (VERSION holds major.minor; n counts up from 0) and updates source.json.
#      dev:  replaces the rolling "dev-build" pre-release (Productium-dev.ipa). No version tag, no source.json change, so
#            testing builds never move the version.
name: ios

on:
  push:
    # Only real code changes test, build and release: docs, source.json, the workflow itself and scripts don't.
    paths:
      - "App/**"
      - "Shared/**"
      - "Packages/**"
      - "Widgets/**"
      - "project.yml"
      - "VERSION"
  workflow_dispatch:

env:
  BUNDLE_PREFIX: ${{ vars.BUNDLE_PREFIX || 'com.example' }}
  # Dev builds are a separate app (own bundle id, name, icon, URL scheme and data) next to the release one.
  APP_ID: ${{ format('{0}.productium{1}', vars.BUNDLE_PREFIX || 'com.example', github.ref == 'refs/heads/dev' && '.dev' || '') }}
  APP_NAME: ${{ github.ref == 'refs/heads/dev' && 'Productium Dev' || 'Productium' }}
  APP_SCHEME: ${{ github.ref == 'refs/heads/dev' && 'productium-dev' || 'productium' }}
  APP_ICON: ${{ github.ref == 'refs/heads/dev' && 'AppIconDev' || 'AppIcon' }}
  # The leaderboard Worker new groups use (scripts/leaderboard/deploy.sh sets it); empty = groups can only be joined.
  LEADERBOARD_URL: ${{ vars.LEADERBOARD_URL || '' }}

jobs:
  core-tests:
    runs-on: ubuntu-latest
    container: swift:6.2-noble
    steps:
      - uses: actions/checkout@v4
      - run: swift test
        working-directory: Packages/ProductiumCore

  ios-compile:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: latest-stable }
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Compile (simulator, unsigned)
        run: |
          set -o pipefail
          xcodebuild -project Productium.xcodeproj -scheme Productium \
            -destination 'generic/platform=iOS Simulator' -configuration Debug \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log | grep -E "error:|warning: .*deprecated|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log
      - name: Upload log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with: { name: build-log, path: build.log }

  ios-free-ipa:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    needs: [core-tests, ios-compile]
    runs-on: macos-26
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Work out the version
        id: version
        run: |
          base=$(tr -d '[:space:]' < VERSION)
          last=$(git tag --list "v$base.*" --sort=-v:refname | head -1)
          if [ -z "$last" ]; then v="$base.0"; else v="$base.$(( ${last##*.} + 1 ))"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: latest-stable }
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Build for device, unsigned
        run: |
          set -o pipefail
          xcodebuild -project Productium.xcodeproj -scheme Productium -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            MARKETING_VERSION=${{ steps.version.outputs.version }} \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tail -30
      - name: Package .ipa (ad-hoc signed so the re-signer keeps the HealthKit entitlement)
        run: |
          cat > app.ent <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>com.apple.developer.healthkit</key><true/>
            <key>com.apple.developer.healthkit.access</key><array/>
            <key>com.apple.developer.healthkit.background-delivery</key><true/>
          </dict></plist>
          PLIST
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Productium.app Payload/
          for x in Payload/Productium.app/PlugIns/*.appex; do codesign -f -s - "$x"; done
          codesign -f -s - --entitlements app.ent Payload/Productium.app
          zip -qry Productium-free.ipa Payload
      - name: Dev build (rolling pre-release, never tagged as a version)
        if: github.ref == 'refs/heads/dev'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp Productium-free.ipa Productium-dev.ipa
          gh release delete dev-build --cleanup-tag -y || true
          gh release create dev-build Productium-dev.ipa --target "${{ github.sha }}" --prerelease --latest=false \
            --title "dev (${{ github.sha }})" --notes "Testing build of ${{ github.sha }} (would be v${{ steps.version.outputs.version }})."
      - name: SideStore source (always the newest build)
        if: github.ref == 'refs/heads/main'
        run: |
          python3 scripts/make-source.py "${{ github.repository }}" "$BUNDLE_PREFIX.productium" \
            "${{ steps.version.outputs.version }}" "${{ github.run_number }}" Productium-free.ipa source.json
      - name: Release (the stable asset name keeps releases/latest/download/Productium-free.ipa current for SideStore)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" Productium-free.ipa source.json \
            --target "${{ github.sha }}" --title "v${{ steps.version.outputs.version }}" \
            --generate-notes --latest
      - name: Keep the repo's source.json in step (SideStore checks the version against the IPA)
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          cp source.json "$RUNNER_TEMP/source.json"
          git fetch origin main
          git checkout -f -B main origin/main
          cp "$RUNNER_TEMP/source.json" source.json
          git add source.json
          git commit -m "Update source.json for v${{ steps.version.outputs.version }}" || exit 0
          git push origin main
